[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "charaka"
version = "0.1.0"
description = "Chemotype-symmetric Junction-Tree VAE for SARS-CoV-2 M^pro inhibitor design"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "M. Chidhvilas Tanay"},
]
dependencies = [
    "torch>=1.13",
    "torch-geometric>=2.3",
    "rdkit>=2024.03",
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "scipy>=1.11",
    "pymoo>=0.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
admet = ["admet-ai>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
